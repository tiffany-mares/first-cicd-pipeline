name: Deploy to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::503233513399:role/github-deploy-29086
          aws-region: ca-central-1

      - run: |
          aws s3 sync . s3://tiffany-mares-site-17239 --delete \
            --exclude ".git/*" --exclude ".github/*"
