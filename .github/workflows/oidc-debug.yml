name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print the OIDC token claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "FAILED to get a token. 'permissions: id-token: write' is missing"
            echo "or nested in the wrong place. It must be at the top level."
            exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done

          echo "===== WHAT GITHUB IS SENDING ====="
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d \
            | jq '{iss, aud, sub, repository, repository_owner, ref}'
          echo "=================================="
